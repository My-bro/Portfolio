<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Hunter</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; color: #f5f5f5; }
  #stage { display: grid; place-items: center; height: 100%; }
  canvas { display: block; max-width: 100%; max-height: 100%; outline: none; }
  #boot { position: absolute; inset: 0; display: grid; place-items: center;
    text-align: center; padding: 24px; background: #000; }
  #err { color: #f8633e; max-width: 32rem; }
</style>
</head>
<body>
<div id="stage"><canvas id="canvas" width="900" height="900" tabindex="0"></canvas></div>
<div id="boot"><div><p id="msg">Chargement…</p><p id="err"></p></div></div>
<script type="module">
  const canvas = document.getElementById('canvas');
  const boot = document.getElementById('boot');
  const msg = document.getElementById('msg');
  const err = document.getElementById('err');
  canvas.addEventListener('mousedown', () => canvas.focus());
  try {
    const createMyHunter = (await import('./myhunter.js')).default;
    await createMyHunter({
      canvas,
      setStatus: (t) => { if (t) msg.textContent = t; },
      printErr: (t) => { console.error(t); if (/error|failed|abort/i.test(t)) err.textContent = t; },
    });
    boot.remove();
    canvas.focus();
  } catch (e) {
    msg.textContent = 'Le jeu n’a pas pu démarrer';
    err.textContent = e && e.message ? e.message : String(e);
  }
</script>
</body>
</html>
