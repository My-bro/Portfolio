<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R-Type</title>
<!--
  Page de jeu, chargée dans une iframe par la fiche projet.

  L'isolation est délibérée : un module Emscripten ne se démonte pas
  proprement — sa boucle principale vit dans requestAnimationFrame, ses
  éléments <video> dans le document. Retirer l'iframe emporte tout d'un coup,
  là où un démontage React laisserait la boucle tourner en fond.

  Le mode se lit dans la requête :

    ?mode=local     le serveur est compilé dans le module, tout tient ici
    ?mode=online    le serveur hébergé, joint par le relais WebSocket

  C'est cette page qui fixe window.RTYPE_RELAY, que le module lit au
  démarrage — même convention que RTYPE_VIDEO_BASE pour les cinématiques.
-->
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%;
    background: #000;
    font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #f5f5f5;
    overflow: hidden;
  }
  #stage { display: grid; place-items: center; height: 100%; }
  /* Transparent : la vidéo de fond passe derrière le canvas (z-index 0),
     les aperçus de personnage devant (z-index 2). */
  canvas { display: block; max-width: 100%; max-height: 100%; outline: none;
           background: transparent; position: relative; z-index: 1; }

  /* Au-dessus de tout, y compris des cinématiques. */
  #audio {
    position: fixed; right: 12px; bottom: 12px; z-index: 3;
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; border-radius: 8px;
    background: rgba(0, 0, 0, .62);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 255, 255, .14);
    opacity: .45; transition: opacity .2s;
  }
  #audio:hover, #audio:focus-within { opacity: 1; }
  #audio button {
    background: none; border: 0; padding: 0; cursor: pointer;
    color: inherit; font: inherit; line-height: 1;
  }
  #audio input { width: 88px; accent-color: #f8633e; cursor: pointer; }
  #audio output { min-width: 3ch; text-align: right; color: #a1a1a1; }

  #boot {
    position: absolute; inset: 0; z-index: 4;
    display: grid; place-items: center; gap: 12px;
    text-align: center; padding: 24px;
    background: #000;
  }
  #boot p { margin: 0; color: #a1a1a1; }
  #bar { width: min(280px, 70vw); height: 3px; background: #2a2a2a; border-radius: 2px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: #f8633e; transition: width .2s; }
  #err { color: #f8633e; max-width: 32rem; }
  #fallback {
    margin-top: 14px; display: none;
    background: #f8633e; color: #0a0a0a;
    border: 0; border-radius: 6px; padding: 7px 14px;
    font: inherit; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="canvas" width="960" height="540" tabindex="0"></canvas>
</div>

<div id="audio" hidden>
  <button id="mute" type="button" aria-label="Couper le son" title="Couper le son">🔊</button>
  <input id="vol" type="range" min="0" max="100" step="5" value="25" aria-label="Volume">
  <output id="volValue">25</output>
</div>

<div id="boot">
  <div>
    <p id="msg">Chargement du moteur…</p>
    <div id="bar"><div id="fill"></div></div>
    <p id="err"></p>
    <button id="fallback" type="button">Jouer en local</button>
  </div>
</div>

<script type="module">
  // Les cinématiques sont servies à côté du module, pas embarquées.
  window.RTYPE_VIDEO_BASE = './video/';

  /**
   * Relais WebSocket devant le serveur de jeu.
   *
   * Une page en HTTPS ne peut pas ouvrir de WebSocket en clair : il faut du
   * wss://, donc un nom et un certificat — l'adresse IP nue n'en aura jamais.
   * Voir docker/README.md dans le dépôt du jeu.
   */
  const RELAY = 'wss://rtype.bazarbe.live';

  const params = new URLSearchParams(location.search);
  const online = params.get('mode') === 'online';

  // Échappatoire de mise au point : depuis une page en http, on peut viser
  // le relais en clair avant que le nom et le certificat ne soient posés —
  // ?relay=ws://5.135.148.107:8099. Le schéma est vérifié, rien d'autre ne
  // passe.
  const override = params.get('relay');
  const relay = override && /^wss?:\/\/[^\s]+$/.test(override) ? override : RELAY;

  // Lu par le module au démarrage : vide, il monte le serveur embarqué.
  window.RTYPE_RELAY = online ? relay : '';

  const canvas = document.getElementById('canvas');
  const boot = document.getElementById('boot');
  const msg = document.getElementById('msg');
  const fill = document.getElementById('fill');
  const err = document.getElementById('err');
  const audio = document.getElementById('audio');
  const slider = document.getElementById('vol');
  const readout = document.getElementById('volValue');
  const muteButton = document.getElementById('mute');
  const fallback = document.getElementById('fallback');

  fallback.addEventListener('click', () => location.replace('?mode=local'));

  // Le jeu se pilote aux touches : sans focus, rien ne répond.
  const focus = () => canvas.focus();
  canvas.addEventListener('mousedown', focus);
  window.addEventListener('load', focus);

  // ZQSD et espace ne doivent pas faire défiler la page hôte.
  window.addEventListener('keydown', (event) => {
    if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) {
      event.preventDefault();
    }
  }, { passive: false });

  let module = null;
  let volume = Number(slider.value);
  let muted = false;

  /**
   * Le son a deux origines : SDL_mixer pour la musique et les bruitages,
   * les balises <video> pour les cinématiques. Un seul réglage gouverne
   * les deux — le menu d'options du jeu ne pilote que la première.
   */
  function applyVolume() {
    const effective = muted ? 0 : volume;
    readout.textContent = effective;
    muteButton.textContent = effective === 0 ? '🔇' : '🔊';

    if (module) {
      try {
        module.ccall('rtype_set_volume', null, ['number'], [effective]);
      } catch { /* export absent : on se rabat sur les <video> seules */ }
      for (const el of module.__rtypeVideos || []) {
        if (el) el.volume = effective / 100;
      }
    }
  }

  slider.addEventListener('input', () => {
    volume = Number(slider.value);
    muted = false;
    applyVolume();
  });

  muteButton.addEventListener('click', () => {
    muted = !muted;
    applyVolume();
    focus();
  });

  /**
   * Vérifie que le relais répond, avant d'en télécharger 13 Mo pour rien.
   *
   * Une poignée de main WebSocket est le seul test qui prouve vraiment
   * quelque chose : elle échoue aussi bien sur un nom inconnu qu'un port
   * fermé ou un certificat refusé, exactement les cas où la partie ne
   * démarrerait pas. Le lien est refermé aussitôt.
   */
  function reachRelay(url) {
    return new Promise((resolve) => {
      let socket = null;
      const settle = (ok) => {
        clearTimeout(timer);
        try { socket && socket.close(); } catch { /* déjà fermé */ }
        resolve(ok);
      };
      const timer = setTimeout(() => settle(false), 6000);
      try {
        socket = new WebSocket(url + '/?tcp=8080');
        socket.onopen = () => settle(true);
        socket.onerror = () => settle(false);
        socket.onclose = () => settle(false);
      } catch {
        settle(false);
      }
    });
  }

  try {
    if (online) {
      msg.textContent = 'Connexion au serveur…';
      if (!await reachRelay(relay)) {
        msg.textContent = 'Serveur injoignable';
        err.textContent = relay + ' ne répond pas. La partie en ligne demande '
          + 'que la pile du jeu tourne et que le relais soit exposé en wss.';
        fallback.style.display = 'inline-block';
        throw new Error('relais injoignable');
      }
      msg.textContent = 'Chargement du moteur…';
    }

    const createRType = (await import('./rtype.js')).default;

    module = await createRType({
      canvas,
      setStatus: (text) => {
        // Emscripten annonce sa progression sous la forme "(12/34)".
        const match = /\((\d+)\/(\d+)\)/.exec(text || '');
        if (match) {
          fill.style.width = (100 * match[1] / match[2]) + '%';
          msg.textContent = 'Chargement des ressources…';
        } else if (text) {
          msg.textContent = text;
        }
      },
      printErr: (text) => {
        // Tout passe par la console : cette fonction remplace celle
        // d'Emscripten, et n'y rien renvoyer revenait à rendre le module
        // muet — un paquet refusé en boucle ne laissait aucune trace.
        console.error(text);
        if (/error|failed|abort/i.test(text)) err.textContent = text;
      },
    });

    boot.remove();
    audio.hidden = false;
    applyVolume();

    // Les cinématiques sont créées au fil du jeu : chaque nouvelle balise
    // doit hériter du réglage courant.
    new MutationObserver((records) => {
      for (const record of records) {
        for (const node of record.addedNodes) {
          if (node.nodeName === 'VIDEO') node.volume = muted ? 0 : volume / 100;
        }
      }
    }).observe(document.body, { childList: true });

    focus();
  } catch (error) {
    fill.style.width = '0';
    // Le relais injoignable a déjà dit ce qu'il fallait, et propose une
    // porte de sortie : l'écraser par un message générique la retirerait.
    if (fallback.style.display !== 'inline-block') {
      msg.textContent = 'Le jeu n’a pas pu démarrer';
      err.textContent = error && error.message ? error.message : String(error);
    }
  }
</script>
</body>
</html>
